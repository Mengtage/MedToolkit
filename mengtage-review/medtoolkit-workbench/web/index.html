<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mengtage 科研工作台</title><link rel="stylesheet" href="/style.css"><body><main><header><small>MENGTAGE · RESEARCH</small><h1>科研工作台</h1><p>记录问题，保存证据，随时继续。</p></header><section><label>访问令牌<input id="token" type="password" autocomplete="off"></label><button id="connect">连接工作台</button><p id="notice" role="status"></p></section><section><h2>开始一个课题</h2><textarea id="question" placeholder="用一句话描述研究问题"></textarea><button id="create">建立项目</button></section><section><h2>我的项目</h2><select id="projects"></select><button id="refresh">刷新进展</button></section><section><h2>检索文献</h2><label>已确认的 PubMed 检索式<textarea id="query"></textarea></label><button id="search">检索前 50 条</button><p>本轮为有限条数检索，结果会显示是否完整。</p></section><section><h2>统计验收</h2><p>仅使用合成数据。选择两列进行相关性分析，不调用模型。</p><label>方法<select id="method"><option value="pearson">Pearson</option><option value="spearman">Spearman</option></select></label><label>合成数据 JSON<textarea id="rows">[{"x":1,"y":2},{"x":2,"y":4},{"x":3,"y":6},{"x":4,"y":8}]</textarea></label><button id="statistics">提交统计任务</button></section><section><h2>写作</h2><p id="writing">Gemini 未配置，暂不调用模型。</p></section><section><h2>任务与产物</h2><div id="jobs"></div><pre id="artifact"></pre></section><footer>研发预览 · 当前统计验收仅使用合成数据</footer></main><script src="/app.js"></script></body></html>
