[pytest]
# 全仓统一测试入口。
# 三个子模块历史上各自为政：有的测试要手动开服务（scripts/manual/*），
# 有的脚本在导入期就发 HTTP 请求，直接 `pytest` 会在 collection 阶段报连接错误。
# 这里显式声明可自动化的测试目录，避免把手工冒烟脚本当成单元测试。
testpaths =
    MedPaperHunter/backend
    MedPaperWriter/tests
    MedStat/tests

python_files = test_*.py
python_functions = test_*
addopts = -q

filterwarnings =
    ignore::DeprecationWarning
