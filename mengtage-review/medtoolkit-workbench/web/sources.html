<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedHunter 来源集合</title><link rel="stylesheet" href="/style.css"><body><main><header><h1>来源集合与增量版本</h1><p>冻结检索快照，合并原始记录后去重、重新筛选。不会相加旧筛选结论。</p></header><section><label>工作台访问令牌<input id="source-token" type="password" autocomplete="off"></label><button id="source-connect">连接</button><button id="source-logout">退出</button><label>项目<select id="source-project"></select></label><button id="source-refresh">刷新来源</button><p id="source-notice" role="status"></p></section><section><h2>登记已有 PubMed 检索</h2><select id="native-search"></select><label><input id="capture-confirm" type="checkbox">确认登记选定检索的实际来源和覆盖情况</label><button id="capture-source">登记检索快照</button></section><section><h2>导入其他数据库或注册库的公开书目记录</h2><p>JSON只包含书目字段，不调用模型。覆盖完整性由导入者声明；未知命中数填null。当前不支持网站追溯等其他来源路径。</p><label>来源信息 JSON<textarea id="source-meta">{"database":"Synthetic database","kind":"database","query":"synthetic query","searched_at":"2026-11-21","total_hits":1,"complete":true,"coverage_note":"合成示例，非真实检索"}</textarea></label><label>书目记录 JSON<textarea id="source-records">[{"title":"Synthetic report","pmid":"123","abstract":"Synthetic abstract"}]</textarea></label><label><input id="import-confirm" type="checkbox">确认这是公开书目数据，且来源及覆盖信息已核对</label><button id="import-source">保存导入快照</button></section><section><h2>选择本轮全部来源</h2><p>新增版本需列明完整来源清单。原始记录合计上限1000；同一快照不可重复加入；跨来源重复由后续去重处理。</p><label>基于哪个既有集合创建新版本<select id="collection-parent"></select></label><div id="source-runs"></div><label>集合名称<input id="collection-label"></label><label>建版或修订理由<textarea id="collection-reason"></textarea></label><label><input id="collection-confirm" type="checkbox">确认勾选的是本轮完整来源清单</label><button id="create-collection">冻结来源集合版本</button></section><section><h2>冻结集合及历史版本</h2><div id="source-collections"></div></section><footer><a href="/">返回工作台运行去重任务与准备筛选</a> · Gemini保持空白</footer></main><script src="/sources.js"></script></body></html>
